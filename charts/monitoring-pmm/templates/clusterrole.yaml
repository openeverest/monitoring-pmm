{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring-pmm.fullname" . }}
  labels:
    {{- include "monitoring-pmm.labels" . | nindent 4 }}
# Rules are generated by controller-gen from the kubebuilder RBAC markers in
# internal/controller/rbac.go. Run `make generate` to update.
# The controller reads the monitoring kinds and patches only their status. It
# also reads Secrets, because the probe authenticates with the PMM token in the
# destination's credentials Secret; monitoring-pmm is the one monitoring
# extension that reads destination Secrets.
rules:
{{- .Files.Get "generated/rbac-rules.yaml" | nindent 2 }}
{{- end }}
