{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "monitoring-pmm.fullname" . }}
  labels:
    {{- include "monitoring-pmm.labels" . | nindent 4 }}
# A class controller reads the monitoring kinds, Instances and Providers and
# writes only monitoring status (spec 014 §4.6). It never writes Instances.
rules:
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses, monitoringdestinations, monitoringbindings]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.openeverest.io]
    resources: [monitoringclasses/status, monitoringdestinations/status, monitoringbindings/status]
    verbs: [get, patch, update]
  - apiGroups: [core.openeverest.io]
    resources: [instances, providers]
    verbs: [get, list, watch]
  # The destination's token Secret, read to probe the PMM server. Spec 014
  # §4.8 narrows this to a per-Secret Role generated by core; PoC reads
  # cluster-wide.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
{{- end }}
