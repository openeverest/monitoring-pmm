{{- if .Values.class.create -}}
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: {{ .Values.class.name }}
  labels:
    {{- include "monitoring-pmm.labels" . | nindent 4 }}
spec:
  controllerName: openeverest.io/monitoring-pmm
  displayName: {{ .Values.class.displayName | quote }}
  description: Percona Monitoring and Management 3. The database provider runs pmm-client next to each database and registers it with the PMM server (metrics and Query Analytics).
  providerManaged:
    integration: pmm
    agentImage: {{ required "class.agentImage is required: the pmm-client image the providers run next to each database, e.g. percona/pmm-client:3.8.0" .Values.class.agentImage | quote }}
    agentVersion: {{ required "class.agentVersion is required: the version of class.agentImage, e.g. 3.8.0" .Values.class.agentVersion | quote }}
    features: [queryAnalytics]
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      required: [url]
      properties:
        url:
          type: string
          pattern: '^https?://.+'
          description: PMM Server URL, for example https://pmm.example.com.
        verifyTLS:
          type: boolean
          description: Verify the PMM Server TLS certificate. Defaults to true.
  instanceParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: object
          description: Resource requirements of the pmm-client container.
          properties:
            limits:
              type: object
              additionalProperties:
                type: string
            requests:
              type: object
              additionalProperties:
                type: string
  credentialsSchema:
    required: [apiKey]
  ui:
    summaryParameter: url
    links:
      - name: Open in PMM
        url: '{{ "{{" }} .destination.parameters.url {{ "}}" }}'
{{- end }}
