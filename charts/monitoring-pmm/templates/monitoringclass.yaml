{{- if .Values.class.create -}}
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: {{ .Values.class.name }}
  labels:
    {{- include "monitoring-pmm.labels" . | nindent 4 }}
spec:
  controllerName: openeverest.io/monitoring-pmm
  displayName: {{ .Values.class.displayName }}
  description: Operator-native PMM integration rendered by the provider (metrics + QAN).
  providerManaged:
    integration: pmm
    agentImage: {{ .Values.class.agentImage }}
    agentVersion: {{ .Values.class.agentVersion }}
    features: [queryAnalytics]
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: PMM Server URL, e.g. https://pmm.example.com
        verifyTLS:
          type: boolean
          description: Verify the PMM Server TLS certificate (default true).
  instanceParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: object
          description: Resource requirements of the pmm-client container.
          properties:
            limits:
              type: object
              additionalProperties:
                type: string
            requests:
              type: object
              additionalProperties:
                type: string
  credentialsSchema:
    required: [apiKey]
{{- end }}
