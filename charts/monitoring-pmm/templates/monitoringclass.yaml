{{- if .Values.class.create -}}
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: {{ .Values.class.name }}
  labels:
    {{- include "monitoring-pmm.labels" . | nindent 4 }}
spec:
  displayName: {{ .Values.class.displayName | quote }}
  description: Percona Monitoring and Management 3. The database provider runs pmm-client next to each database and registers it with the PMM server (metrics and Query Analytics). pmm-client does not verify the PMM server certificate (bindings report AgentTLSNotVerified); a destination's spec.tls applies only to this controller's check of the server.
  providerManaged:
    integration: pmm
    agentImage: {{ required "class.agentImage is required: the pmm-client image the providers run next to each database, e.g. percona/pmm-client:3.8.0" .Values.class.agentImage | quote }}
    agentVersion: {{ required "class.agentVersion is required: the version of class.agentImage, e.g. 3.8.0" .Values.class.agentVersion | quote }}
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      required: [url]
      properties:
        url:
          type: string
          pattern: '^https?://[^/?#@]+([/?#].*)?$'
          description: PMM Server URL, for example https://pmm.example.com, without user information.
  authModes:
    - name: ServiceAccountToken
      credentials:
        required: [token]
  instanceParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: object
          description: Resource requirements of the pmm-client container.
          additionalProperties: false
          properties:
            limits:
              type: object
              additionalProperties:
                anyOf:
                  - type: integer
                  - type: string
                pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                x-kubernetes-int-or-string: true
            requests:
              type: object
              additionalProperties:
                anyOf:
                  - type: integer
                  - type: string
                pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                x-kubernetes-int-or-string: true
  uiSchema:
    destination:
      componentsOrder: [url]
      components:
        url:
          path: parameters.url
          uiType: text
          fieldParams:
            label: PMM server URL
            placeholder: https://pmm.example.com
            helperText: PMM 3 server reachable from the cluster; the database pods register with it.
          validation:
            required: true
            url: true
    credentials:
      ServiceAccountToken:
        componentsOrder: [token]
        components:
          token:
            path: token
            uiType: text
            fieldParams:
              label: Service account token
              type: password
              placeholder: glsa_...
              helperText: Token of a PMM service account with the Admin role.
            validation:
              required: true
    instance:
      componentsOrder: [resources]
      components:
        resources:
          uiType: group
          groupType: line
          label: pmm-client resources
          description: Requests and limits of the pmm-client container, on top of the Instance size defaults.
          componentsOrder: [cpuRequest, memoryRequest, cpuLimit, memoryLimit]
          components:
            cpuRequest:
              path: parameters.resources.requests.cpu
              uiType: text
              fieldParams:
                label: CPU request
                placeholder: 100m
            memoryRequest:
              path: parameters.resources.requests.memory
              uiType: text
              fieldParams:
                label: Memory request
                placeholder: 128Mi
            cpuLimit:
              path: parameters.resources.limits.cpu
              uiType: text
              fieldParams:
                label: CPU limit
                placeholder: 500m
            memoryLimit:
              path: parameters.resources.limits.memory
              uiType: text
              fieldParams:
                label: Memory limit
                placeholder: 256Mi
{{- end }}
