---
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new commit arrives.
# On main we let runs queue so every commit is validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile binary
        run: go build -o /dev/null ./cmd/controller

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo '::error::go.mod or go.sum is not tidy. Run go mod tidy and commit the result.'; exit 1; }

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test-unit

  verify:
    name: Verify generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated files are up-to-date
        run: make verify

  copyright:
    name: Copyright headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful on PRs — push to main is already vetted.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check copyright headers on changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM \
            "origin/${BASE_REF}"...HEAD \
            | grep -E '\.go$' || true)

          if [[ -z "$FILES" ]]; then
            echo "No source files changed — skipping copyright check."
            exit 0
          fi

          echo "Checking:"
          echo "$FILES"

          # The fixer exits 1 when it modifies files; capture that separately.
          echo "$FILES" | xargs python3 hack/add_copyright.py || true

          if ! git diff --quiet; then
            echo ""
            echo "::error::Missing copyright headers. Run the following and commit:"
            echo "  python3 hack/add_copyright.py <changed-files>"
            echo ""
            git diff
            exit 1
          fi

          echo "All copyright headers are present."

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint Helm chart
        run: helm lint charts/monitoring-pmm

      - name: Verify the agent image is required
        run: |
          for value in class.agentImage class.agentVersion; do
            if out=$(helm template test charts/monitoring-pmm --set "$value=" 2>&1); then
              echo "::error::the chart renders with an empty $value"
              exit 1
            fi
            echo "$out" | grep -q "$value is required" \
              || { echo "::error::unexpected error for an empty $value: $out"; exit 1; }
          done

  test-integration:
    name: Integration / destination readiness
    needs: [lint, build, test-unit, verify, helm-lint]
    uses: ./.github/workflows/integration-test.yaml
    with:
      make_target: test-integration
      suite: destination-readiness
