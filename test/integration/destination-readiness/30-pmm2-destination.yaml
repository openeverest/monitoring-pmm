---
apiVersion: v1
kind: Secret
metadata:
  name: pmm2-it-token
type: Opaque
stringData:
  token: glsa_chainsaw-token
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm2-it
spec:
  classRef:
    name: pmm
  parameters:
    url: (join('', ['http://fake-pmm.', $namespace, '.svc:8081']))
  authentication:
    mode: ServiceAccountToken
    credentialsSecretRef:
      name: pmm2-it-token
