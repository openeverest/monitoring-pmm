---
apiVersion: v1
kind: Secret
metadata:
  name: pmm-viewer-it-token
type: Opaque
stringData:
  token: glsa_chainsaw-viewer-token
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm-viewer-it
spec:
  classRef:
    name: pmm
  url: (join('', ['http://fake-pmm.', $namespace, '.svc:8080']))
  authentication:
    mode: ServiceAccountToken
    credentialsSecretRef:
      name: pmm-viewer-it-token
