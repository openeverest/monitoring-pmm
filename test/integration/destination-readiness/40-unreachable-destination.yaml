---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm-missing-it
spec:
  classRef:
    name: pmm
  parameters:
    url: (join('', ['http://pmm-missing.', $namespace, '.svc:8080']))
  authentication:
    mode: ServiceAccountToken
    credentialsSecretRef:
      name: pmm-it-token
